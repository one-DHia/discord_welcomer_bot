<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Welcomer - Connexion Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="glass-card login-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <div class="brand-logo" style="margin: 0 auto 15px auto;">
                    <svg viewBox="0 0 127.14 96.36">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36c8-10.83,12.78-22.44,14.65-34.59a72.48,72.48,0,0,1-11.45-5.46c.92-.68,1.82-1.39,2.68-2.12A75.14,75.14,0,0,0,91,54.19c.86.73,1.76,1.44,2.68,2.12a72.48,72.48,0,0,1-11.45,5.46c1.87,12.15,6.68,23.76,14.65,34.59a105.73,105.73,0,0,0,31-18.83C129.56,50.77,123.38,27.82,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.9,46,53.9,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.14,46,96.14,53,91,65.69,84.69,65.69Z"/>
                    </svg>
                </div>
                <h1 style="font-size: 26px; margin-bottom: 8px; font-weight: 700; color: white;">Configuration Panel</h1>
                <p style="color: var(--text-secondary); font-size: 14px;">Connectez-vous pour configurer le bot welcomer</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Nom d'utilisateur</label>
                    <input class="form-input" type="text" id="username" required placeholder="admin" autocomplete="username">
                </div>

                <div class="form-group" style="margin-bottom: 30px;">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input class="form-input" type="password" id="password" required placeholder="••••" autocomplete="current-password">
                </div>

                <button class="btn btn-primary" type="submit">
                    Se Connecter
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/login.js"></script>
</body>
</html>
